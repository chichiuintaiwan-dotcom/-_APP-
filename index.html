function levelUI(){let h='';for(let k=0;k<5;k++){let c=k<s.stage?'done':k===s.stage?'active':'';h+=`<div class="level ${c}"><b>${k<s.stage?'✓':'關 '+(k+1)}</b>${k*10+1}–${k*10+10} 題</div>`}$('levels').innerHTML=h}
function begin(){let base=s.mode==='wrong'?data.filter(x=>s.wrong.has(x.n)):shuffle(data);if(!base.length){base=shuffle(data);alert('目前沒有錯題，先挑戰全部題目！')}s.q=base.slice(0,50);s.stage=0;s.i=0;s.score=0;s.streak=0;s.correct=0;s.answered=false;$('game').classList.remove('hidden');$('stageResult').classList.add('hidden');$('finalResult').classList.add('hidden');levelUI();render()}
function render(){s.answered=false;let x=s.q[s.i];if(!x){finish();return}let start=stageStart(s.stage), size=STAGE_SIZES[s.stage]||22; $('tag').textContent=`第 ${s.stage+1} 關｜本關第 ${s.i-start+1}/${size} 題｜${x.c}｜題庫題號 ${x.n}`;$('question').textContent=x.q;$('options').innerHTML='';x.o.forEach((t,j)=>{let b=document.createElement('button');b.className='opt';b.textContent=`${j+1}. ${t}`;b.onclick=()=>answer(j);$('options').appendChild(b)});$('feedback').className='feedback';$('feedback').textContent=s.mode==='memory'?'先回想提示，再選答案。':'選一個答案開始挑戰。';$('next').disabled=true;$('prev').disabled=s.i===0;$('done').textContent=`${s.i+1}/${s.q.length}`;$('correctCount').textContent=`${s.correct} / ${s.q.length}`;$('score').textContent=s.score;$('streak').textContent=s.streak;$('bar').style.width=(s.i/s.q.length*100)+'%'}
function answer(j){if(s.answered)return;s.answered=true;let x=s.q[s.i],ok=j===x.a-1;document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===x.a-1)b.classList.add('correct');if(k===j&&!ok)b.classList.add('wrong')});tone(ok);if(ok){s.correct++;s.streak++;s.score+=10+Math.min(s.streak,5);sparks();$('feedback').className='feedback good';$('feedback').textContent='答對！ '+x.e;s.wrong.delete(x.n)}else{s.streak=0;s.wrong.add(x.n);$('feedback').className='feedback bad';$('feedback').textContent=`答錯。正解是「${x.o[x.a-1]}」。${x.e}`}localStorage.setItem('wrongIds',JSON.stringify([...s.wrong]));$('score').textContent=s.score;$('streak').textContent=s.streak;$('correctCount').textContent=`${s.correct} / ${s.q.length}`;$('next').disabled=false}
function next(){if(!s.answered)return;s.i++;if((s.i===stageStart(s.stage)+STAGE_SIZES[s.stage]-1)&&s.i<s.q.length){$('game').classList.add('hidden');$('stageResult').classList.remove('hidden');$('stageTitle').textContent=`第 ${s.stage+1} 關完成！`;$('stageText').textContent=`已完成 ${s.i}/${s.q.length} 題；目前答對 ${s.correct} 題，得分 ${s.score}。`;s.stage++;levelUI();return}render()}
function prev(){if(!s.i)return;s.i--;s.stage=Math.floor(s.i/10);s.answered=false;levelUI();render()}
function finish(){$('game').classList.add('hidden');$('finalResult').classList.remove('hidden');$('finalText').textContent=`本輪答對 ${s.correct}/${s.q.length} 題，總得分 ${s.score}。錯題已加入錯題重練。`;$('bar').style.width='100%';s.stage=5;levelUI();sparks()}
const STAGE_SIZES=Array(49).fill(22).concat([12]);let selectedStage=0;
function stageStart(k){return k<49?k*22:49*22}
function buildLevelGrid(){let h='';for(let k=0;k<50;k++){h+=`<button class="levelcard ${k===selectedStage?'active':''}" data-stage="${k}"><b>${k===selectedStage?'✓ ':''}關 ${k+1}</b><span class="range">${STAGE_SIZES[k]} 題</span></button>`}$('levelGrid').innerHTML=h;document.querySelectorAll('.levelcard').forEach(b=>b.onclick=()=>{selectedStage=+b.dataset.stage;buildLevelGrid()})}
function showSelect(){buildLevelGrid();$('selectPage').style.display='block';$('gamePage').style.display='none'}
$('startSelected').onclick=()=>{s.mode='all';s.q=data.slice();s.i=Math.min(stageStart(selectedStage),s.q.length-1);s.stage=selectedStage;s.score=0;s.streak=0;s.correct=0;s.answered=false;$('selectPage').style.display='none';$('gamePage').style.display='block';$('game').classList.remove('hidden');render()};$('startAll').onclick=()=>{selectedStage=0;$('startSelected').click()};$('hint').onclick=()=>{let x=s.q[s.i];$('feedback').className='feedback';$('feedback').textContent='提示：'+x.h};$('next').onclick=next;$('prev').onclick=prev;$('restart').onclick=showSelect;$('continue').onclick=()=>{$('stageResult').classList.add('hidden');$('game').classList.remove('hidden');s.answered=false;render()};$('again').onclick=showSelect;showSelect();
</script></body></html>
